name: "Install native addon artifacts"
description: >
   Downloads the native addons built once by the Rust job and installs exact
   targets without invoking Bazel.

inputs:
   targets:
      description: Space-separated scripts/bazel-natives.ts target names
      required: true
   dest:
      description: Destination directory for the .node files
      required: false
      default: packages/natives/native

runs:
   using: composite
   steps:
      - name: Download native addon artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           name: native-addons
           path: ${{ runner.temp }}/omp-native-artifacts

      - name: Install native addon targets
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_DEST: ${{ inputs.dest }}
        run: |
           set -euo pipefail
           read -r -a targets <<< "$NATIVE_TARGETS"
           if [ "${#targets[@]}" -eq 0 ]; then
             echo "::error::At least one native addon target is required"
             exit 1
           fi
           if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
             node - "$RUNNER_TEMP/omp-native-artifacts" "${targets[@]}" <<'EOF'
           const assert = require("node:assert/strict");
           const fs = require("node:fs");
           const path = require("node:path");
           const { createHash } = require("node:crypto");
           const { execFileSync } = require("node:child_process");
           const root = process.argv[2];
           const receipt = JSON.parse(fs.readFileSync(path.join(root, "native-addons-provenance.json"), "utf8"));
           const sourceSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
           assert.equal(receipt.schema, 1);
           assert.equal(receipt.sourceSha, sourceSha, "native artifact must match the consumer checkout");
           assert.equal(receipt.platform, process.platform);
           assert.equal(receipt.architecture, process.arch);
           assert.equal(receipt.version, JSON.parse(fs.readFileSync("packages/natives/package.json", "utf8")).version);
           for (const target of process.argv.slice(3)) {
             const artifact = receipt.artifacts[target];
             const file = `natives-${target}/pi_natives.${target}.node`;
             assert.equal(artifact?.file, file, `missing native artifact provenance for ${target}`);
             const sha256 = createHash("sha256").update(fs.readFileSync(path.join(root, file))).digest("hex");
             assert.equal(sha256, artifact.sha256, `native artifact hash mismatch for ${target}`);
             console.log(`Verified ${target}: ${sourceSha} ${sha256}`);
           }
           EOF
           fi
           bun scripts/bazel-natives.ts "${targets[@]}" \
             --source "$RUNNER_TEMP/omp-native-artifacts" \
             --dest "$NATIVE_DEST"
